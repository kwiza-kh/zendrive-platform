version: "3.8"

services:
  backend:
    build:
      context: ./zendrive_backend
      dockerfile: Dockerfile
    container_name: zendrive-backend
    restart: unless-stopped
    env_file:
      - ./zendrive_backend/.env
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/db:/app/db
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3

  user:
    build:
      context: ./zendrive_user
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-/api}
        REACT_APP_STATIC_BASE_URL: ${REACT_APP_STATIC_BASE_URL:-}
    container_name: zendrive-user
    restart: unless-stopped
    expose:
      - "80"

  admin:
    build:
      context: ./zendrive_admin
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-/api}
        REACT_APP_STATIC_BASE_URL: ${REACT_APP_STATIC_BASE_URL:-}
    container_name: zendrive-admin
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    container_name: zendrive-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/uploads:/uploads:ro
    depends_on:
      - backend
      - user
      - admin
